# Kamal 2 deployment to the DigitalOcean droplet.
# Usage: see docs/DEPLOYING.md. Requires `gem install kamal` (or the kamal Docker image).

service: fbc_chms
image: jlsjls/fbc-chms

servers:
  web:
    - 137.184.91.29

proxy:
  ssl: true
  host: manage.fbcenumclaw.com
  app_port: 3000
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

registry:
  username: jlsjls
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  clear:
    APP_URL: https://manage.fbcenumclaw.com
  secret:
    - DATABASE_URL

# The Rails app's SQLite files, mounted READ-ONLY so `import-rails` can copy
# them into Postgres. The originals are never modified, which keeps a rollback
# to the Rails app possible. Remove this once the migration is settled.
volumes:
  - "volume_sfo3_01:/legacy-rails-storage:ro"

accessories:
  db:
    image: postgres:17-alpine
    host: 137.184.91.29
    # Bound to localhost only; the app reaches it over Kamal's Docker network as `fbc_chms-db`.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: fbc
        POSTGRES_DB: fbc_chms
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

aliases:
  logs: app logs -f
  shell: app exec --interactive --reuse "bash"
  cli: app exec --reuse "node dist/server/cli.js"
  psql: accessory exec db --interactive --reuse "psql -U fbc fbc_chms"
  # Writes a compressed dump to the db accessory's data dir on the droplet.
  backup: accessory exec db --reuse "sh -c 'pg_dump -U fbc -Fc fbc_chms > /var/lib/postgresql/data/backup-$(date +%Y%m%d-%H%M%S).dump'"
